name: CI

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref && github.ref || github.run_id }}
  cancel-in-progress: true

on:
  push:
    branches:
      - main
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
      - closed

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.13', '3.14', '3.15']

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        run: pip install uv

      # pyodbc builds from source where it ships no wheel (Python 3.15), and
      # that needs the unixODBC headers.
      - name: Install unixODBC
        run: sudo apt-get update -qq && sudo apt-get install -y -qq unixodbc-dev

      - name: Install dependencies
        run: make install

      - name: Run linters, formatters, type checkers
        run: make check

      - name: Run tests
        run: make test

      - name: Build packages
        run: make build
